{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Quick Add" />
  <link rel="apple-touch-icon" href="{% static 'icons/spendwise-sw-icon-180.png' %}" />
  <link rel="manifest" href="{% static 'quick-add.webmanifest' %}" />
  <title>Quick Add</title>
  <style>
    body { margin: 3rem auto; padding: 0 1.25rem; max-width: 30rem; background: #0b1020; color: #f8fafc; font: 1rem/1.6 system-ui; }
    a { color: #c7d2fe; }
  </style>
</head>
<body>
  <main>
    <h1>SpendWise Quick Add</h1>
    <p>In Safari, tap <strong>Share</strong>, then <strong>Add to Home Screen</strong>. Turn on <strong>Open as Web App</strong> if shown, then tap <strong>Add</strong>.</p>
    <p>Tap the Quick Add icon to log an expense.</p>
    <a id="quickAddLink" href="{% url 'dashboard' %}?quick_add=1">Open Quick Add now</a>
  </main>
  <script>
    if (navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
      window.location.replace(document.getElementById('quickAddLink').href);
    }
  </script>
</body>
</html>
