name: Django CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  django:
    name: Django checks and tests
    runs-on: ubuntu-latest
    env:
      DB_ENGINE: sqlite3
      DEBUG: "true"
      SECRET_KEY: ci-only-validation-key-000000000000000000000000000000000000

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Django configuration
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test --noinput

      - name: Build production static files
        env:
          DEBUG: "false"
        run: python manage.py collectstatic --noinput

  deploy:
    name: Trigger Northflank release
    needs: django
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Start release for the tested commit
        env:
          NORTHFLANK_RELEASE_WEBHOOK_URL: ${{ secrets.NORTHFLANK_RELEASE_WEBHOOK_URL }}
        run: |
          if [ -z "$NORTHFLANK_RELEASE_WEBHOOK_URL" ]; then
            echo "Missing NORTHFLANK_RELEASE_WEBHOOK_URL repository secret" >&2
            exit 1
          fi
          curl --fail --silent --show-error --max-time 30 \
            --get --data-urlencode "sha=$GITHUB_SHA" \
            --data-urlencode "branch=main" \
            "$NORTHFLANK_RELEASE_WEBHOOK_URL"
