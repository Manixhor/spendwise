services:
  - type: web
    name: spendwise-web
    runtime: python
    buildCommand: ./build.sh
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: USE_WHITENOISE
        value: "1"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: spendwise-postgres
          property: connectionString
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "True"
      - key: SMTP_USE_SSL
        value: "False"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  - type: cron
    name: spendwise-monthly-analysis-mail
    runtime: python
    schedule: "0 * * * *"
    buildCommand: ./build.sh
    startCommand: python manage.py send_monthly_analysis_emails
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: USE_WHITENOISE
        value: "1"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: spendwise-postgres
          property: connectionString
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "True"
      - key: SMTP_USE_SSL
        value: "False"

databases:
  - name: spendwise-postgres
    databaseName: spendwise
    user: spendwise
    plan: 0.5c-1g
    diskSizeGB: 10
    ipAllowList: []
