<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">SpendWise SW app icon</title>
  <desc id="desc">A rounded white square app icon with bold black SW initials.</desc>
  <defs>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000000" flood-opacity="0.42"/>
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="edge" x1="180" y1="112" x2="844" y2="904" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#050505"/>
      <stop offset="0.56" stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="none"/>
  <g filter="url(#iconShadow)">
    <rect x="104" y="94" width="816" height="816" rx="188" fill="url(#edge)"/>
    <rect x="158" y="148" width="708" height="708" rx="136" fill="#ffffff"/>
    <rect x="158" y="148" width="708" height="708" rx="136" fill="none" stroke="#070707" stroke-width="14" opacity="0.92"/>
    <rect x="178" y="168" width="668" height="668" rx="118" fill="none" stroke="#efefef" stroke-width="8"/>
  </g>

  <text
    x="512"
    y="502"
    text-anchor="middle"
    dominant-baseline="middle"
    fill="#050505"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="282"
    font-weight="900"
    letter-spacing="-20">SW</text>
</svg>
