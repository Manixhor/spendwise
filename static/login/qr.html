<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpendWise QR Code</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  .qr-card {
    background: white;
    border-radius: 24px;
    padding: 40px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    max-width: 380px;
    width: 90%;
  }
  .qr-card img {
    width: 260px;
    height: 260px;
    border-radius: 16px;
    border: 2px solid #f0f0f0;
    margin: 20px 0;
  }
  h1 {
    font-size: 22px;
    color: #1a1a2e;
    margin-bottom: 6px;
  }
  .subtitle {
    color: #888;
    font-size: 13px;
    margin-bottom: 16px;
  }
  .url {
    background: #f5f5f7;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 12px;
    color: #555;
    word-break: break-all;
    margin-bottom: 20px;
  }
  .download-btn {
    display: inline-block;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    padding: 12px 32px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    transition: transform 0.2s;
  }
  .download-btn:hover { transform: scale(1.05); }
</style>
</head>
<body>
  <div class="qr-card">
    <h1>📱 SpendWise</h1>
    <p class="subtitle">Scan to open on your phone</p>
    <img src="/static/login/spendwise_qr.png" alt="SpendWise QR Code" />
    <div class="url">site--spendwise--m9lhjm5ftxzt.code.run</div>
    <a href="/static/login/spendwise_qr.png" download="spendwise_qr.png" class="download-btn">⬇ Download QR</a>
  </div>
</body>
</html>
